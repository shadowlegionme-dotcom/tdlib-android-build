
name: Build TDLib Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gperf php-cli perl make tar unzip wget \
            curl ninja-build build-essential

      - name: Extract TDLib source
        run: |
          test -f td-master.zip
          mkdir source
          unzip -q td-master.zip -d source

      - name: Install Android NDK and CMake
        run: |
          sdkmanager \
            "ndk;23.2.8568313" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Build TDLib
        working-directory: source/td-master/example/android
        run: |
          ln -s "$ANDROID_HOME" SDK
          chmod +x ./*.sh
          ./check-environment.sh
          ./build-openssl.sh SDK
          ./build-tdlib.sh SDK 23.2.8568313 third-party/openssl c++_static Java 19 "arm64-v8a"

      - name: Upload TDLib library
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: source/td-master/example/android/tdlib/tdlib.zip
          if-no-files-found: error
          retention-days: 7
